<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBA Rowing - Team Management</title>
    <link rel="stylesheet" href="../static/css/base.css">
    <link rel="stylesheet" href="../static/css/layout.css">
    <link rel="stylesheet" href="../static/css/sidebar.css">
    <link rel="stylesheet" href="../static/css/views.css">
    <link rel="stylesheet" href="../static/css/timetable.css">
    <link rel="stylesheet" href="../static/css/teams.css">
    <link rel="stylesheet" href="../static/css/trials.css">
    <link rel="stylesheet" href="../static/css/responsive.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-top-sheen"></div>
            <div class="sidebar-scroll">
                <div class="logo-section">
                    <div class="logo-box">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="3" width="18" height="18" rx="4" stroke="rgba(237,232,222,0.7)" stroke-width="1.5"/>
                            <path d="M8 16 C9.5 13 11 11 12 9 C13 7 13.5 6 14.5 5" stroke="#EDE8DE" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="15" cy="4.5" r="1.8" stroke="#EDE8DE" stroke-width="1.5" fill="none"/>
                            <path d="M7.5 13 Q10 14 12 13 Q14 12 16.5 13" stroke="rgba(237,232,222,0.38)" stroke-width="1.1" stroke-linecap="round" fill="none"/>
                        </svg>
                    </div>
                    <div class="logo-text">
                        <div class="logo-main">IBA Rowing</div>
                        <div class="logo-sub">Pakistan</div>
                    </div>
                </div>
                <nav class="navbar">
                    <button class="nav-btn active" data-view="home">Home</button>
                    <button class="nav-btn" data-view="teams">Teams</button>
                    <button class="nav-btn" data-view="timetable">Timetable</button>
                    <button class="nav-btn" data-view="trials">Trials</button>
                    <button class="nav-btn" data-view="login">Login / Register</button>
                </nav>
            </div>
            <footer class="sidebar-footer">
                <div class="footer-icons">
                    <a href="mailto:ibarowing@gmail.com" class="footer-icon" aria-label="IBA Rowing Email" title="IBA Rowing Email">
                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                            <rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/>
                            <path d="M2 7l8 5 8-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </a>
                    <a href="https://instagram.com/ibarowing" class="footer-icon" aria-label="IBA Rowing on Instagram" title="IBA Rowing on Instagram" target="_blank" rel="noopener noreferrer">
                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                            <rect x="2" y="2" width="16" height="16" rx="4.5" stroke="currentColor" stroke-width="1.6"/>
                            <circle cx="10" cy="10" r="3.4" stroke="currentColor" stroke-width="1.6"/>
                            <circle cx="14.6" cy="5.4" r="0.85" fill="currentColor"/>
                        </svg>
                    </a>
                </div>
                <p class="footer-copyright">© IBA Rowing Team. All rights reserved.</p>
            </footer>
        </aside>

        <main class="right-panel">
            <img src="../static/imports/iso_boat2.png" alt="" class="boat-background">
            <img src="../static/imports/iso_boat2.png" alt="Completed Sculling Shell (5x+) technical diagram" class="boat-normal">

            <div class="view home-view active">
            </div>

            <div class="view teams-view">
                <div class="view-content">
                    <h2 class="view-title">Team Members</h2>
                    <div class="view-blur-overlay"></div>
                    <div class="members-table-container">
                        <table class="members-table">
                            <thead>
                                <tr>
                                    <th>ERP ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="team-members-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="view timetable-view">
                <div class="view-content timetable-content">
                    <div class="view-blur-overlay"></div>
            
                    <div class="calendar-header">
                        <button class="calendar-nav" id="previous-month">&lt;</button>
                        <h2 class="view-title" id="calendar-month">August 2026</h2>
                        <button class="calendar-nav" id="next-month">&gt;</button>
                    </div>
            
                    <div class="calendar-weekdays">
                        <div>MON</div>
                        <div>TUE</div>
                        <div>WED</div>
                        <div>THU</div>
                        <div>FRI</div>
                        <div>SAT</div>
                        <div>SUN</div>
                    </div>
            
                    <div class="calendar-grid" id="calendar-grid">
                    </div>
                </div>
            </div>

            <div class="view trials-view">
                <div class="view-content trials-content">
                    <div class="trials-header">
                        <h2 class="view-title">Upcoming Trials</h2>
                    </div>
                        <div class="trials-list">
                            <div class="trial-info-container"></div>
                        
                            <div class="trial-registration-card">
                                <div class="trial-registration-title">
                                    Register for Trial
                                </div>
                        
                                <div class="trial-form">
                                    <div class="trial-input-box">
                                        <label>ERP ID</label>
                                        <input type="text" placeholder="Enter your ERP ID">
                                    </div>
                        
                                    <div class="trial-form-row">
                                        <div class="trial-input-box">
                                            <label>First Name</label>
                                            <input type="text" placeholder="Enter your first name">
                                        </div>
                        
                                        <div class="trial-input-box">
                                            <label>Last Name</label>
                                            <input type="text" placeholder="Enter your last name">
                                        </div>
                                    </div>
                        
                                    <div class="trial-input-box">
                                        <label>Phone Number</label>
                                        <input type="tel" placeholder="Enter your phone number">
                                    </div>
                        
                                    <button class="trial-confirm-button" type="button">
                                        Register
                                    </button>
                                </div>
                        
                                <div class="trial-success">
                                    <div class="trial-success-icon">
                                        <svg viewBox="0 0 52 52">
                                            <circle
                                                class="trial-success-circle"
                                                cx="26"
                                                cy="26"
                                                r="24">
                                            </circle>
                                            <path
                                                class="trial-success-check"
                                                d="M15 27 L22 34 L37 18">
                                            </path>
                                        </svg>
                                    </div>
                        
                                    <div class="trial-success-title">
                                        Registration Successful
                                    </div>
                        
                                    <div class="trial-success-message">
                                        You have been registered successfully.
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="view-blur-overlay"></div>
                </div>
            </div>

            <div class="view login-view">
                <div class="view-content">
                    <h2 class="view-title">Login / Register</h2>
                    <div class="view-blur-overlay"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="../static/js/teams.js"></script>
    <script src="../static/js/timetable/calendar.js"></script>
    <script src="../static/js/timetable/events.js"></script>
    <script src="../static/js/timetable/calendar_animation.js"></script>
    <script src="../static/js/trials.js"></script>
    <script src="../static/js/navigation.js"></script>
</body>
</html>
